<!-- Custom styles injected into <head> by the Chirpy theme. -->
<style>
  /* TryHackMe room banners are very wide (3:1 to 5:1), so the default "cover"
     crop cuts off the room name. Show the whole banner instead, on a background
     that matches the banners' navy so the letterboxing blends in. */
  .preview-img img[src*="/thm/"],
  img.preview-img[src*="/thm/"] {
    object-fit: contain;
    background-color: #151c2b;
  }

  /* Home page cards: put the cover image on the left instead of the right
     (Chirpy uses flex-md-row-reverse), and round its left corners to match. */
  @media all and (min-width: 768px) {
    #post-list .post-preview.flex-md-row-reverse {
      flex-direction: row !important;
    }

    #post-list .card .preview-img,
    #post-list .card .preview-img img {
      border-radius: 10px 0 0 10px;
    }
  }

  /* Walking duck along the bottom of the page. It never blocks clicks, and it
     is hidden for visitors who turned on "reduce motion" in their OS. */
  #walking-duck {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 56px;
    height: 56px;
    z-index: 1;
    pointer-events: none;
    animation: duck-walk 40s linear infinite;
  }

  #walking-duck img {
    width: 100%;
    height: 100%;
    transform-origin: 50% 100%;
    animation: duck-waddle 0.5s ease-in-out infinite alternate;
  }

  /* Walk right, turn around, walk back left, turn around. */
  @keyframes duck-walk {
    0%     { transform: translateX(-60px) scaleX(1); }
    49.9%  { transform: translateX(calc(100vw + 4px)) scaleX(1); }
    50%    { transform: translateX(calc(100vw + 4px)) scaleX(-1); }
    99.9%  { transform: translateX(-60px) scaleX(-1); }
    100%   { transform: translateX(-60px) scaleX(1); }
  }

  @keyframes duck-waddle {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg) translateY(-2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #walking-duck { display: none; }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var duck = document.createElement('div');
    duck.id = 'walking-duck';
    duck.setAttribute('aria-hidden', 'true');
    duck.innerHTML = '<img src="{{ "/assets/img/duck.svg" | relative_url }}" alt="">';
    document.body.appendChild(duck);
  });
</script>
