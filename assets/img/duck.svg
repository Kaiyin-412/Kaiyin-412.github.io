<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Simple cartoon yellow duck (faces right) used by the walking duck in _includes/metadata-hook.html -->
  <g stroke="#3a2a10" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <path class="foot-back" d="M44 104 q-2 8 -12 9 h18 z" fill="#f4dfa8"/>
    <path class="foot-front" d="M72 104 q2 8 12 9 h-18 z" fill="#f4dfa8"/>
    <!-- body -->
    <ellipse cx="58" cy="82" rx="30" ry="25" fill="#f7cf3d"/>
    <!-- head -->
    <circle cx="60" cy="44" r="27" fill="#f7cf3d"/>
    <!-- hair strands -->
    <path d="M56 18 q-3 -10 -10 -12" fill="none"/>
    <path d="M60 17 q0 -11 4 -14" fill="none"/>
    <path d="M64 18 q5 -9 12 -9" fill="none"/>
    <!-- eyes -->
    <ellipse cx="54" cy="38" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="72" cy="38" rx="7" ry="5" fill="#fff"/>
    <circle cx="55" cy="38" r="1.6" fill="#3a2a10" stroke="none"/>
    <circle cx="73" cy="38" r="1.6" fill="#3a2a10" stroke="none"/>
    <!-- beak -->
    <path d="M52 50 q20 -6 40 2 q4 6 -4 10 q-18 6 -36 0 q-6 -6 0 -12 z" fill="#f4dfa8"/>
    <path d="M58 58 q14 4 28 0" fill="none"/>
    <!-- arms holding head -->
    <path d="M34 60 q-8 -14 2 -26 q4 6 4 14" fill="#f7cf3d"/>
    <path d="M86 60 q8 -14 -2 -26 q-4 6 -4 14" fill="#f7cf3d"/>
  </g>
</svg>
